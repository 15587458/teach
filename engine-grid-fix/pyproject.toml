[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-grid-fix"
version = "0.1.0"
description = "Re-detect beat grids for a whole Engine DJ library (Denon / Engine OS)"
requires-python = ">=3.10"
dependencies = ["numpy", "librosa>=0.10", "soundfile"]

[project.optional-dependencies]
best = ["beat_this @ git+https://github.com/CPJKU/beat_this.git"]
test = ["pytest"]

[project.scripts]
engine-grid-fix = "enginegrid.cli:main"

[tool.setuptools]
packages = ["enginegrid"]

[tool.pytest.ini_options]
pythonpath = ["."]
